<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hub Zero — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0a0e14;
      --panel: #10151c;
      --panel-raised: #151b24;
      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.14);
      --amber: #f5a623;
      --amber-dim: rgba(245, 166, 35, 0.14);
      --teal: #3fa98e;
      --teal-dim: rgba(63, 169, 142, 0.14);
      --rose: #e5484d;
      --rose-dim: rgba(229, 72, 77, 0.12);
      --text: #e7ecf3;
      --text-muted: #7c8798;
      --text-dim: #47505f;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      background: var(--bg);
      position: relative;
    }

    /* ─── HEADER : frequency strip ─── */
    .chat-header {
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 16px; }
    .brand-logo { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: inherit; }
    .brand-mark {
      font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -0.01em;
      color: var(--text);
    }
    .brand-mark em { font-style: normal; color: var(--amber); }
    .brand-sub { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 0.03em; }

    .live-indicator { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--teal); }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); animation: pulse-live 2s infinite; }
    @keyframes pulse-live {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .header-right { display: flex; align-items: center; gap: 10px; }
    .user-pill {
      display: flex; align-items: center; gap: 9px; background: var(--panel-raised);
      border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px 5px 5px;
    }
    .avatar-sq {
      width: 30px; height: 30px; border-radius: 7px; overflow: hidden; flex-shrink: 0;
      background: #1a212c; border: 1px solid var(--border-strong);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--text-muted);
    }
    .avatar-sq img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .user-info { display: flex; flex-direction: column; line-height: 1.25; }
    .user-name { font-size: 12.5px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
    .user-id-tag { font-size: 10px; font-family: var(--font-mono); color: var(--text-dim); }
    .admin-chip {
      display: inline-flex; align-items: center; gap: 3px;
      color: var(--amber); font-size: 9.5px; font-weight: 600;
      letter-spacing: 0.02em;
    }

    .btn-header {
      background: var(--panel-raised); border: 1px solid var(--border); color: var(--text-muted);
      border-radius: 7px; padding: 7px 11px; font-size: 12px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; gap: 6px; transition: border-color 0.15s, color 0.15s; text-decoration: none;
    }
    .btn-header:hover { color: var(--text); border-color: var(--border-strong); }

    /* ─── MESSAGE LOG ─── */
    .messages-container {
      flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth;
    }
    .messages-container::-webkit-scrollbar { width: 6px; }
    .messages-container::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

    .message-row { display: flex; gap: 11px; max-width: 78%; position: relative; }
    .message-row.outgoing { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 34px; height: 34px; border-radius: 8px; overflow: hidden; flex-shrink: 0;
      background: #1a212c; border: 1px solid var(--border-strong);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin-top: 2px;
    }
    .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .msg-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .msg-meta { display: flex; align-items: baseline; gap: 8px; padding: 0 2px; }
    .message-row.outgoing .msg-meta { justify-content: flex-end; }
    .msg-author { font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--text); }
    .msg-time { font-size: 10.5px; font-family: var(--font-mono); color: var(--text-dim); }

    .msg-bubble {
      padding: 10px 14px; border-radius: 4px; font-size: 13.5px; line-height: 1.55; word-break: break-word;
      background: var(--panel); border: 1px solid var(--border); border-left: 2px solid var(--border-strong);
      color: var(--text);
    }
    .message-row.outgoing .msg-bubble {
      border-left: 2px solid var(--teal); background: var(--teal-dim);
    }
    .message-row.is-admin-msg .msg-bubble {
      border-left: 2px solid var(--amber); background: var(--amber-dim);
    }

    .badge-admin-tag {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--amber); font-size: 10px; font-weight: 600; letter-spacing: 0.02em;
    }
    .badge-admin-tag svg { flex-shrink: 0; }

    .msg-actions {
      opacity: 0; display: flex; align-items: center; gap: 4px; transition: opacity 0.15s;
      position: absolute; top: 4px;
    }
    .message-row.incoming .msg-actions { right: -34px; }
    .message-row.outgoing .msg-actions { left: -34px; }
    .message-row:hover .msg-actions { opacity: 1; }

    .btn-msg-delete {
      width: 26px; height: 26px; border-radius: 6px; background: var(--rose-dim);
      border: 1px solid rgba(229, 72, 77, 0.3); color: var(--rose); display: flex; align-items: center;
      justify-content: center; cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .btn-msg-delete:hover { background: var(--rose); color: #fff; }

    .btn-scroll-bottom {
      position: absolute; bottom: 92px; right: 22px; background: var(--panel-raised);
      border: 1px solid var(--border-strong); color: var(--teal); border-radius: 7px;
      padding: 8px 13px; font-size: 11.5px; font-family: var(--font-mono); font-weight: 500; display: flex; align-items: center;
      gap: 6px; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      transition: opacity 0.15s, transform 0.15s; opacity: 0; transform: translateY(8px); pointer-events: none; z-index: 5;
    }
    .btn-scroll-bottom.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .btn-scroll-bottom:hover { border-color: var(--teal); }

    .rate-limit-banner {
      display: none; padding: 9px 16px;
      background: var(--rose-dim);
      border-top: 1px solid rgba(229, 72, 77, 0.3); border-bottom: 1px solid rgba(229, 72, 77, 0.3);
      color: #f3a3a6; font-size: 12px; font-weight: 500; text-align: center;
      align-items: center; justify-content: center; gap: 8px; font-family: var(--font-mono);
    }
    .rate-limit-banner.active { display: flex; }

    /* ─── INPUT CONSOLE ─── */
    .chat-input-panel {
      padding: 14px 22px 18px; border-top: 1px solid var(--border); background: var(--panel);
      display: flex; flex-direction: column; gap: 9px; flex-shrink: 0;
    }
    .input-controls-row { display: flex; align-items: center; justify-content: space-between; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); }

    .admin-tag-toggle-wrap {
      display: none; align-items: center; gap: 8px; padding: 3px 0;
      cursor: pointer; user-select: none;
    }
    .admin-tag-toggle-wrap.visible { display: inline-flex; }
    .tag-switch-label { font-size: 11px; font-weight: 500; color: var(--amber); font-family: var(--font-body); display: flex; align-items: center; gap: 5px; }
    .tag-switch { position: relative; width: 30px; height: 17px; flex-shrink: 0; }
    .tag-switch input { opacity: 0; width: 0; height: 0; }
    .tag-slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #26303e; transition: 0.2s; border-radius: 3px; border: 1px solid var(--border-strong);
    }
    .tag-slider:before {
      position: absolute; content: ""; height: 11px; width: 11px; left: 2px; bottom: 2px;
      background-color: #8792a3; transition: 0.2s; border-radius: 2px;
    }
    .tag-switch input:checked + .tag-slider { background-color: var(--amber-dim); border-color: var(--amber); }
    .tag-switch input:checked + .tag-slider:before { transform: translateX(13px); background-color: var(--amber); }

    .input-box-wrapper {
      display: flex; align-items: center; gap: 10px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 6px 5px 15px; transition: border-color 0.15s;
    }
    .input-box-wrapper:focus-within { border-color: var(--teal); }
    .chat-input {
      flex: 1; background: transparent; border: none; outline: none; color: var(--text);
      font-family: var(--font-body); font-size: 14px; font-weight: 400; padding: 9px 0;
    }
    .chat-input::placeholder { color: var(--text-dim); }

    .btn-send {
      background: var(--teal-dim); border: 1px solid rgba(63, 169, 142, 0.4);
      color: var(--teal); width: 38px; height: 38px; border-radius: 7px; display: flex; align-items: center;
      justify-content: center; cursor: pointer; transition: background 0.15s, color 0.15s; flex-shrink: 0;
    }
    .btn-send:hover:not(:disabled) { background: var(--teal); color: #06110d; }
    .btn-send:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ─── ACCESS MODAL ─── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(6, 8, 12, 0.9); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .auth-card {
      width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border-strong);
      border-left: 2px solid var(--rose);
      border-radius: 6px; padding: 30px 26px; text-align: left;
    }
    .auth-icon { color: var(--rose); margin-bottom: 18px; }
    .auth-title { font-family: var(--font-display); font-size: 19px; font-weight: 600; color: var(--text); margin-bottom: 9px; }
    .auth-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.55; }
    .btn-auth-submit {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%; height: 42px; background: var(--teal-dim);
      border: 1px solid rgba(63, 169, 142, 0.4); color: var(--teal); border-radius: 6px;
      font-size: 13.5px; font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s;
      text-decoration: none;
    }
    .btn-auth-submit:hover { background: var(--teal); color: #06110d; }

    @media (prefers-reduced-motion: reduce) {
      .live-dot { animation: none; }
    }

    @media (max-width: 560px) {
      .chat-header { padding: 12px 14px; }
      .messages-container { padding: 14px; }
      .chat-input-panel { padding: 12px 14px 14px; }
      .message-row { max-width: 90%; }
      .brand-sub { display: none; }
    }
  </style>
</head>

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(isSend = true) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (isSend) {
          osc.frequency.setValueAtTime(540, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } else {
          osc.frequency.setValueAtTime(750, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        }
      } catch (e) {}
    }

    function formatAEST(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const timeFormatter = new Intl.DateTimeFormat('en-AU', {
        timeZone: 'Australia/Brisbane',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
      const dateFormatter = new Intl.DateTimeFormat('en-AU', {
        timeZone: 'Australia/Brisbane',
        day: 'numeric',
        month: 'short'
      });
      const now = new Date();
      const isToday = now.toDateString() === date.toDateString();
      const timeStr = timeFormatter.format(date);
      return isToday ? `Today, ${timeStr} AEST` : `${dateFormatter.format(date)}, ${timeStr} AEST`;
    }

    async function initDropbox() {
      try {
        const cachedFiles = sessionStorage.getItem('hz_dropbox_files');
        if (cachedFiles) dropboxFiles = JSON.parse(cachedFiles);

        const r = await fetch('https://api.dropboxapi.com/oauth2/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            grant_type: 'refresh_token',
            refresh_token: DROPBOX_CONFIG.refreshToken,
            client_id: DROPBOX_CONFIG.appKey,
            client_secret: DROPBOX_CONFIG.appSecret
          })
        });
        const d = await r.json();
        if (d.access_token) {
          dropboxToken = d.access_token;
          if (Object.keys(dropboxFiles).length === 0) {
            await loadDropboxFiles(dropboxToken);
          }
          resolveVisibleAvatars();
        }
      } catch (err) {
        console.warn('Dropbox avatar notice:', err);
      }
    }

    async function loadDropboxFiles(token) {
      try {
        let cursor = null, hasMore = true;
        const map = {};
        while (hasMore) {
          const url = cursor ? 'https://api.dropboxapi.com/2/files/list_folder/continue' : 'https://api.dropboxapi.com/2/files/list_folder';
          const r = await fetch(url, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(cursor ? { cursor } : { path: DROPBOX_CONFIG.folderPath, recursive: false, limit: 2000 })
          });
          const d = await r.json();
          if (!r.ok) break;
          for (const e of d.entries || []) {
            if (e['.tag'] !== 'file' || !/\.(jpe?g|png)$/i.test(e.name)) continue;
            const norm = e.name.replace(/\.[^/.]+$/, '').toLowerCase().replace(/[^a-z0-9]/g, '');
            map[norm] = e.path_lower;
          }
          hasMore = d.has_more;
          cursor = d.cursor;
        }
        dropboxFiles = map;
        sessionStorage.setItem('hz_dropbox_files', JSON.stringify(map));
      } catch (err) {
        console.warn('Dropbox file listing notice:', err);
      }
    }

    function findPhotoPath(name) {
      if (!name) return null;
      const norm = name.toLowerCase().replace(/[^a-z0-9]/g, '');
      if (dropboxFiles[norm]) return dropboxFiles[norm];
      for (const [k, p] of Object.entries(dropboxFiles)) {
        if (norm.length > 5 && (k.includes(norm) || norm.includes(k))) return p;
      }
      return null;
    }

    async function getPhotoUrl(token, path) {
      if (!token || !path) return null;
      if (photoCache[path]) return photoCache[path];
      const sKey = `hz_photo_${path}`;
      const cached = sessionStorage.getItem(sKey);
      if (cached) {
        photoCache[path] = cached;
        return cached;
      }
      try {
        const lr = await fetch('https://api.dropboxapi.com/2/sharing/list_shared_links', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ path, direct_only: true })
        });
        const ld = await lr.json();
        let url = ld.links && ld.links.length > 0 ? ld.links[0].url : null;
        if (!url) {
          const cr = await fetch('https://api.dropboxapi.com/2/sharing/create_shared_link_with_settings', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ path, settings: { requested_visibility: 'public' } })
          });
          const cd = await cr.json();
          url = cd.url;
        }
        if (url) {
          url = url.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
          photoCache[path] = url;
          try { sessionStorage.setItem(sKey, url); } catch (e) {}
          return url;
        }
      } catch (e) {}
      return null;
    }

    async function resolveVisibleAvatars() {
      const avatarElements = document.querySelectorAll('[data-avatar-name]:not([data-avatar-loaded="true"])');
      for (const el of avatarElements) {
        const name = el.getAttribute('data-avatar-name');
        if (!name) continue;
        const path = findPhotoPath(name);
        if (path && dropboxToken) {
          const url = await getPhotoUrl(dropboxToken, path);
          if (url) {
            el.innerHTML = `<img src="${url}" alt="${name}" onerror="this.remove()">`;
            el.setAttribute('data-avatar-loaded', 'true');
          }
        }
      }
    }

    async function resolveUserIdentity() {
      let savedId = "";
      let savedName = "";

      const signedInRaw = localStorage.getItem('Signed_in');
      if (signedInRaw) {
        try {
          const parsed = JSON.parse(signedInRaw);
          if (parsed && parsed.id) {
            savedId = parsed.id;
            savedName = parsed.name || "";
          }
        } catch (e) {}
      }

      if (!savedId) {
        savedId = localStorage.getItem('ep_hub_verified_id') || sessionStorage.getItem('ep_hub_verified_id') || localStorage.getItem('hz_user_id') || "";
        savedName = localStorage.getItem('hz_user_name') || "";
      }

      if (!savedId) {
        authModal.classList.add('active');
        chatInput.disabled = true;
        btnSend.disabled = true;
        return;
      }

      await authenticateUserWithId(savedId, savedName);
    }

    async function authenticateUserWithId(id, fallbackName = "") {
      id = id.trim();
      try {
        let name = fallbackName;
        if (!name && sbClient) {
          const { data: studentData } = await sbClient
            .from('verified_students')
            .select('id, name')
            .eq('id', id)
            .single();
          if (studentData) name = studentData.name;
        }
        if (!name) name = `Student ${id}`;

        let isAdmin = id === '089091';
        if (!isAdmin && sbClient) {
          const { data: adminData } = await sbClient
            .from('admin_students')
            .select('id')
            .eq('id', id)
            .single();
          if (adminData) isAdmin = true;
        }

        currentUser = { id, name, isAdmin };

        document.getElementById('header-user-name').textContent = name;
        document.getElementById('header-user-id').textContent = `ID ${id}`;

        const initials = name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
        document.getElementById('header-avatar-initials').textContent = initials;
        document.getElementById('header-avatar').setAttribute('data-avatar-name', name);

        if (isAdmin) {
          document.getElementById('header-admin-badge').style.display = 'inline-flex';
          adminTagToggleWrap.classList.add('visible');
          btnAdminPurge.style.display = 'flex';
        }

        // Admin tag defaults OFF every session — admins opt in per message via the toggle,
        // rather than every message silently being sent as an official admin post.
        chkAdminTag.checked = false;

        authModal.classList.remove('active');
        chatInput.disabled = false;
        btnSend.disabled = chatInput.value.trim().length === 0;
        chatInput.focus();
        resolveVisibleAvatars();
      } catch (err) {
        console.error('Auth error:', err);
      }
    }

    async function loadMessages() {
      if (!sbClient) return;
      try {
        const { data, error } = await sbClient
          .from('chat_messages')
          .select('*')
          .eq('is_deleted', false)
          .order('created_at', { ascending: true })
          .limit(200);

        if (error) {
          console.warn('Table query note:', error);
          return;
        }

        if (data) {
          const wasScrolledToBottom = !isUserScrolledUp;
          messages = data;
          renderMessages();
          if (wasScrolledToBottom) scrollToBottom();
        }
      } catch (e) {
        console.error('Load messages error:', e);
      }
    }

    function renderMessages() {
      const html = messages.map(m => {
        const isMe = m.student_id === currentUser.id;
        const initials = (m.student_name || 'U').split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
        const timeAest = formatAEST(m.created_at);
        const isAdminMsg = m.is_admin === true;

        return `
          <div class="message-row ${isMe ? 'outgoing' : 'incoming'} ${isAdminMsg ? 'is-admin-msg' : ''}" data-msg-id="${m.id}">
            <div class="msg-avatar" data-avatar-name="${escapeHtml(m.student_name || '')}">
              ${escapeHtml(initials)}
            </div>
            <div class="msg-body">
              <div class="msg-meta">
                <span class="msg-author">${escapeHtml(m.student_name || 'Student')}</span>
                ${isAdminMsg ? '<span class="badge-admin-tag"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 2l8 4v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10V6z"/></svg>Admin</span>' : ''}
                <span class="msg-time">${timeAest}</span>
              </div>
              <div class="msg-bubble">
                ${escapeHtml(m.content)}
              </div>
            </div>
            ${(currentUser.isAdmin) ? `
              <div class="msg-actions">
                <button class="btn-msg-delete" onclick="deleteMessage('${m.id}')" title="Delete message">
                  <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      messagesContainer.innerHTML = html || `
        <div style="text-align: center; color: var(--text-dim); margin-top: 60px; font-size: 13px; font-family: var(--font-mono);">
          no messages yet — be the first to say something
        </div>
      `;

      resolveVisibleAvatars();
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || !currentUser.id || !sbClient) return;

      if (!currentUser.isAdmin) {
        const now = Date.now();
        recentSendTimestamps = recentSendTimestamps.filter(t => now - t < 3000);

        if (recentSendTimestamps.length >= 7) {
          triggerRateLimitCooldown(5);
          return;
        }
        recentSendTimestamps.push(now);
      }

      const showAdmin = currentUser.isAdmin && chkAdminTag.checked;
      chatInput.value = '';
      btnSend.disabled = true;
      charCounter.textContent = '0 / 500';
      playBeep(true);

      try {
        const { data, error } = await sbClient
          .from('chat_messages')
          .insert({
            student_id: currentUser.id,
            student_name: currentUser.name,
            content: text,
            is_admin: showAdmin,
            is_deleted: false,
            created_at: new Date().toISOString()
          })
          .select();

        if (error) {
          alert('Failed to send message: ' + error.message);
          return;
        }

        scrollToBottom();
      } catch (err) {
        console.error('Send error:', err);
      }
    }

    window.deleteMessage = async function(id) {
      if (!currentUser.isAdmin || !sbClient) return;
      if (!confirm('Delete this message?')) return;
      try {
        await sbClient
          .from('chat_messages')
          .update({ is_deleted: true })
          .eq('id', id);

        messages = messages.filter(m => m.id !== id);
        renderMessages();
      } catch (err) {
        console.error('Delete error:', err);
      }
    };

    btnAdminPurge.onclick = async () => {
      if (!currentUser.isAdmin || !sbClient) return;
      if (!confirm('Purge all chat messages for everyone? This cannot be undone.')) return;
      try {
        await sbClient
          .from('chat_messages')
          .update({ is_deleted: true })
          .eq('is_deleted', false);

        messages = [];
        renderMessages();
      } catch (err) {
        console.error('Purge error:', err);
      }
    };

    function triggerRateLimitCooldown(seconds) {
      chatInput.disabled = true;
      btnSend.disabled = true;
      rateLimitBanner.classList.add('active');

      let remaining = seconds;
      rateLimitText.textContent = `rate limit hit (7 msgs / 3s) — cooling down ${remaining}s…`;

      if (cooldownTimer) clearInterval(cooldownTimer);
      cooldownTimer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(cooldownTimer);
          cooldownTimer = null;
          rateLimitBanner.classList.remove('active');
          chatInput.disabled = false;
          btnSend.disabled = chatInput.value.trim().length === 0;
          chatInput.focus();
        } else {
          rateLimitText.textContent = `cooling down ${remaining}s…`;
        }
      }, 1000);
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      btnScrollBottom.classList.remove('visible');
      isUserScrolledUp = false;
    }

    messagesContainer.onscroll = () => {
      const scrollPos = messagesContainer.scrollTop + messagesContainer.clientHeight;
      const threshold = messagesContainer.scrollHeight - 80;
      if (scrollPos < threshold) {
        isUserScrolledUp = true;
        btnScrollBottom.classList.add('visible');
      } else {
        isUserScrolledUp = false;
        btnScrollBottom.classList.remove('visible');
      }
    };

    btnScrollBottom.onclick = scrollToBottom;

    chatInput.oninput = () => {
      const len = chatInput.value.length;
      charCounter.textContent = `${len} / 500`;
      btnSend.disabled = chatInput.value.trim().length === 0;
    };

    chatInput.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    };

    btnSend.onclick = sendMessage;

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function setupRealtime() {
      if (!sbClient) return;
      const channel = sbClient
        .channel('public:chat_messages')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_messages' }, payload => {
          if (payload.eventType === 'INSERT') {
            const newMsg = payload.new;
            if (!newMsg.is_deleted && !messages.some(m => m.id === newMsg.id)) {
              messages.push(newMsg);
              renderMessages();
              if (newMsg.student_id !== currentUser.id) playBeep(false);
              if (!isUserScrolledUp) scrollToBottom();
            }
          } else if (payload.eventType === 'UPDATE') {
            const updated = payload.new;
            if (updated.is_deleted) {
              messages = messages.filter(m => m.id !== updated.id);
            } else {
              const idx = messages.findIndex(m => m.id === updated.id);
              if (idx !== -1) messages[idx] = updated;
            }
            renderMessages();
          } else if (payload.eventType === 'DELETE') {
            messages = messages.filter(m => m.id !== payload.old.id);
            renderMessages();
          }
        })
        .subscribe();

      setInterval(loadMessages, 2500);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await resolveUserIdentity();
      await loadMessages();
      scrollToBottom();
      setupRealtime();
      initDropbox();
    });
  </script>
</body>
</html>
