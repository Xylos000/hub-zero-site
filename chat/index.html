<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hub Zero — Chat & DMs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0a0e14;
      --panel: #10151c;
      --panel-raised: #151b24;
      --panel-hover: #1b232e;
      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.14);
      --amber: #f5a623;
      --amber-dim: rgba(245, 166, 35, 0.14);
      --teal: #3fa98e;
      --teal-dim: rgba(63, 169, 142, 0.14);
      --blue: #38bdf8;
      --blue-dim: rgba(56, 189, 248, 0.14);
      --rose: #e5484d;
      --rose-dim: rgba(229, 72, 77, 0.12);
      --text: #e7ecf3;
      --text-muted: #7c8798;
      --text-dim: #47505f;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      background: var(--bg);
      position: relative;
    }

    /* ─── HEADER ─── */
    .chat-header {
      padding: 12px clamp(16px, 4vw, 40px);
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left { display: flex; align-items: center; gap: 20px; }
    .brand-logo { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: inherit; }
    .brand-mark {
      font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -0.01em;
      color: var(--text);
    }
    .brand-mark em { font-style: normal; color: var(--amber); }
    .brand-sub { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 0.03em; }

    /* Mode Navigation Tabs (Global vs DMs) */
    .chat-nav-tabs {
      display: flex;
      align-items: center;
      background: var(--panel-raised);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }

    .nav-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-display);
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s;
    }

    .nav-tab-btn:hover {
      color: var(--text);
    }

    .nav-tab-btn.active {
      background: var(--bg);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .nav-tab-btn.active.tab-global { color: var(--teal); }
    .nav-tab-btn.active.tab-dms { color: var(--blue); }

    .badge-unread {
      background: var(--rose);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 10px;
      display: none;
    }

    .header-right { display: flex; align-items: center; gap: 10px; }
    .user-pill {
      display: flex; align-items: center; gap: 9px; background: var(--panel-raised);
      border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px 5px 5px;
    }
    .avatar-sq {
      width: 30px; height: 30px; border-radius: 7px; overflow: hidden; flex-shrink: 0;
      background: #1a212c; border: 1px solid var(--border-strong);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--text-muted);
    }
    .avatar-sq img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .user-info { display: flex; flex-direction: column; line-height: 1.25; }
    .user-name { font-size: 12.5px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
    .user-id-tag { font-size: 10px; font-family: var(--font-mono); color: var(--text-dim); }
    .admin-chip {
      display: inline-flex; align-items: center; gap: 3px;
      color: var(--amber); font-size: 9.5px; font-weight: 600;
      letter-spacing: 0.02em;
    }

    .btn-header {
      background: var(--panel-raised); border: 1px solid var(--border); color: var(--text-muted);
      border-radius: 7px; padding: 7px 11px; font-size: 12px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; gap: 6px; transition: border-color 0.15s, color 0.15s; text-decoration: none;
    }
    .btn-header:hover { color: var(--text); border-color: var(--border-strong); }

    /* ─── MAIN WORKSPACE (SIDEBAR + CHAT AREA) ─── */
    .chat-workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* ─── DM SIDEBAR ─── */
    .dm-sidebar {
      width: 290px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: none;
      flex-direction: column;
      flex-shrink: 0;
    }

    .dm-sidebar.active {
      display: flex;
    }

    .dm-sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .dm-sidebar-title {
      font-family: var(--font-display);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
    }

    .btn-new-dm {
      background: var(--blue-dim);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--blue);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .btn-new-dm:hover {
      background: var(--blue);
      color: #061019;
    }

    .dm-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dm-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
    }

    .dm-item:hover {
      background: var(--panel-raised);
      border-color: var(--border);
    }

    .dm-item.active {
      background: var(--panel-raised);
      border-color: var(--blue);
      border-left: 3px solid var(--blue);
    }

    .dm-item-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .dm-item-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dm-item-last {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ─── CHAT MAIN STAGE ─── */
    .chat-main-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      min-width: 0;
      position: relative;
    }

    /* Channel Sub-Header (When in DM) */
    .channel-sub-header {
      padding: 10px clamp(16px, 4vw, 40px);
      background: var(--panel-raised);
      border-bottom: 1px solid var(--border);
      display: none;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
    }

    .channel-sub-header.active {
      display: flex;
    }

    .channel-info-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .channel-target-name {
      font-weight: 700;
      color: var(--blue);
      font-family: var(--font-display);
    }

    .channel-target-id {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
    }

    /* ─── MESSAGE LOG ─── */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 22px clamp(16px, 4vw, 40px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .messages-container::-webkit-scrollbar { width: 6px; }
    .messages-container::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

    .message-row { display: flex; gap: 11px; max-width: 78%; position: relative; }
    .message-row.outgoing { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 34px; height: 34px; border-radius: 8px; overflow: hidden; flex-shrink: 0;
      background: #1a212c; border: 1px solid var(--border-strong);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin-top: 2px;
    }
    .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .msg-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .msg-meta { display: flex; align-items: baseline; gap: 8px; padding: 0 2px; }
    .message-row.outgoing .msg-meta { justify-content: flex-end; }
    .msg-author { font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--text); }
    .msg-time { font-size: 10.5px; font-family: var(--font-mono); color: var(--text-dim); }

    .msg-bubble {
      padding: 10px 14px; border-radius: 4px; font-size: 13.5px; line-height: 1.55; word-break: break-word;
      background: var(--panel); border: 1px solid var(--border); border-left: 2px solid var(--border-strong);
      color: var(--text);
    }
    .message-row.outgoing .msg-bubble {
      border-left: 2px solid var(--teal); background: var(--teal-dim);
    }
    .message-row.is-admin-msg .msg-bubble {
      border-left: 2px solid var(--amber); background: var(--amber-dim);
    }

    .badge-admin-tag {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--amber); font-size: 10px; font-weight: 600; letter-spacing: 0.02em;
    }

    /* Message Actions (Delete) */
    .msg-actions {
      opacity: 0; display: flex; align-items: center; gap: 4px; transition: opacity 0.15s;
      position: absolute; top: 4px;
    }
    .message-row.incoming .msg-actions { right: -34px; }
    .message-row.outgoing .msg-actions { left: -34px; }
    .message-row:hover .msg-actions { opacity: 1; }

    .btn-msg-delete {
      width: 26px; height: 26px; border-radius: 6px; background: var(--rose-dim);
      border: 1px solid rgba(229, 72, 77, 0.3); color: var(--rose); display: flex; align-items: center;
      justify-content: center; cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .btn-msg-delete:hover { background: var(--rose); color: #fff; }

    .btn-scroll-bottom {
      position: absolute; bottom: 92px; right: clamp(16px, 4vw, 40px); background: var(--panel-raised);
      border: 1px solid var(--border-strong); color: var(--teal); border-radius: 7px;
      padding: 8px 13px; font-size: 11.5px; font-family: var(--font-mono); font-weight: 500; display: flex; align-items: center;
      gap: 6px; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      transition: opacity 0.15s, transform 0.15s; opacity: 0; transform: translateY(8px); pointer-events: none; z-index: 5;
    }
    .btn-scroll-bottom.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .btn-scroll-bottom:hover { border-color: var(--teal); }

    .rate-limit-banner {
      display: none; padding: 9px 16px;
      background: var(--rose-dim);
      border-top: 1px solid rgba(229, 72, 77, 0.3); border-bottom: 1px solid rgba(229, 72, 77, 0.3);
      color: #f3a3a6; font-size: 12px; font-weight: 500; text-align: center;
      align-items: center; justify-content: center; gap: 8px; font-family: var(--font-mono);
    }
    .rate-limit-banner.active { display: flex; }

    /* ─── INPUT CONSOLE ─── */
    .chat-input-panel {
      padding: 14px clamp(16px, 4vw, 40px) 18px; border-top: 1px solid var(--border); background: var(--panel);
      display: flex; flex-direction: column; gap: 9px; flex-shrink: 0;
    }
    .input-controls-row { display: flex; align-items: center; justify-content: space-between; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); }

    .admin-tag-toggle-wrap {
      display: none; align-items: center; gap: 8px; padding: 3px 0;
      cursor: pointer; user-select: none;
    }
    .admin-tag-toggle-wrap.visible { display: inline-flex; }
    .tag-switch-label { font-size: 11px; font-weight: 500; color: var(--amber); font-family: var(--font-body); display: flex; align-items: center; gap: 5px; }
    .tag-switch { position: relative; width: 30px; height: 17px; flex-shrink: 0; }
    .tag-switch input { opacity: 0; width: 0; height: 0; }
    .tag-slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #26303e; transition: 0.2s; border-radius: 3px; border: 1px solid var(--border-strong);
    }
    .tag-slider:before {
      position: absolute; content: ""; height: 11px; width: 11px; left: 2px; bottom: 2px;
      background-color: #8792a3; transition: 0.2s; border-radius: 2px;
    }
    .tag-switch input:checked + .tag-slider { background-color: var(--amber-dim); border-color: var(--amber); }
    .tag-switch input:checked + .tag-slider:before { transform: translateX(13px); background-color: var(--amber); }

    .input-box-wrapper {
      display: flex; align-items: center; gap: 10px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 6px 5px 15px; transition: border-color 0.15s;
    }
    .input-box-wrapper:focus-within { border-color: var(--teal); }
    .chat-input {
      flex: 1; background: transparent; border: none; outline: none; color: var(--text);
      font-family: var(--font-body); font-size: 14px; font-weight: 400; padding: 9px 0;
    }
    .chat-input::placeholder { color: var(--text-dim); }

    .btn-send {
      background: var(--teal-dim); border: 1px solid rgba(63, 169, 142, 0.4);
      color: var(--teal); width: 38px; height: 38px; border-radius: 7px; display: flex; align-items: center;
      justify-content: center; cursor: pointer; transition: background 0.15s, color 0.15s; flex-shrink: 0;
    }
    .btn-send:hover:not(:disabled) { background: var(--teal); color: #06110d; }
    .btn-send:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ─── NEW DM USER SEARCH MODAL ─── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(6, 8, 12, 0.88); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .search-card {
      width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--border-strong);
      border-radius: 12px; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      display: flex; flex-direction: column; gap: 14px; max-height: 85vh;
    }

    .search-card-header {
      display: flex; align-items: center; justify-content: space-between;
    }
    .search-card-title {
      font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--text);
    }
    .btn-modal-close {
      background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px;
    }
    .btn-modal-close:hover { color: #fff; }

    .search-input-wrap {
      display: flex; align-items: center; gap: 10px; background: var(--bg);
      border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 12px;
    }
    .search-input-wrap:focus-within { border-color: var(--blue); }
    .search-input {
      flex: 1; background: transparent; border: none; outline: none; color: #fff; font-family: inherit; font-size: 13.5px;
    }

    .search-results-list {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; max-height: 320px;
    }
    .search-results-list::-webkit-scrollbar { width: 5px; }
    .search-results-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

    .search-user-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px;
      background: var(--panel-raised); border: 1px solid var(--border); cursor: pointer; transition: all 0.15s;
    }
    .search-user-item:hover {
      border-color: var(--blue); background: var(--panel-hover);
    }
    .search-user-info { flex: 1; min-width: 0; }
    .search-user-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .search-user-id { font-size: 10.5px; font-family: var(--font-mono); color: var(--text-dim); }

    /* ─── ACCESS RESTRICTED SCREEN (STANDALONE) ─── */
    .unauth-screen {
      position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center;
      padding: 20px; z-index: 9999;
    }
    .unauth-card {
      width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--border-strong);
      border-left: 3px solid var(--rose); border-radius: 10px; padding: 32px 26px; text-align: left;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .unauth-icon { color: var(--rose); margin-bottom: 18px; }
    .unauth-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
    .unauth-desc { font-size: 13.5px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.6; }
    .btn-login-redirect {
      display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 44px;
      background: var(--teal-dim); border: 1px solid rgba(63, 169, 142, 0.4); color: var(--teal);
      border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    .btn-login-redirect:hover { background: var(--teal); color: #06110d; }

    @media (max-width: 768px) {
      .dm-sidebar { width: 220px; }
      .chat-header { padding: 12px 14px; }
      .messages-container { padding: 14px; }
      .chat-input-panel { padding: 12px 14px 14px; }
      .message-row { max-width: 92%; }
      .brand-sub { display: none; }
    }
  </style>
</head>
<body>

  <div class="chat-app" id="chat-app-root">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-left">
        <a href="/" class="brand-logo">
          <span class="brand-mark">HUB <em>ZERO</em></span>
          <span class="brand-sub">MESSAGES</span>
        </a>

        <!-- Switcher Tabs -->
        <div class="chat-nav-tabs">
          <button class="nav-tab-btn tab-global active" id="tab-btn-global" onclick="switchMode('global')">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            <span>Global</span>
          </button>
          <button class="nav-tab-btn tab-dms" id="tab-btn-dms" onclick="switchMode('dms')">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            <span>Direct Messages</span>
            <span class="badge-unread" id="dm-unread-count">0</span>
          </button>
        </div>
      </div>

      <div class="header-right">
        <div class="user-pill" id="current-user-pill">
          <div class="avatar-sq" id="header-avatar">
            <span id="header-avatar-initials">?</span>
          </div>
          <div class="user-info">
            <span class="user-name">
              <span id="header-user-name">Connecting…</span>
              <span class="admin-chip" id="header-admin-badge" style="display: none;">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2l8 4v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10V6z"/></svg>
                ADMIN
              </span>
            </span>
            <span class="user-id-tag" id="header-user-id">ID ----</span>
          </div>
        </div>

        <button class="btn-header" id="btn-admin-purge" style="display: none;" title="Admin: purge messages">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Purge</span>
        </button>

        <a href="/" class="btn-header" title="Return to dashboard">

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (isSend) {
          osc.frequency.setValueAtTime(540, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } else {
          osc.frequency.setValueAtTime(750, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);

          osc.stop(audioCtx.currentTime + 0.08);
        }
      } catch (e) {}
    }

    // ─── AEST TIME FORMATTER ───
    function formatAEST(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const timeFormatter = new Intl.DateTimeFormat('en-AU', {
        timeZone: 'Australia/Brisbane',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
      const dateFormatter = new Intl.DateTimeFormat('en-AU', {
        timeZone: 'Australia/Brisbane',
        day: 'numeric',
        month: 'short'
      });
      const now = new Date();
      const isToday = now.toDateString() === date.toDateString();
      const timeStr = timeFormatter.format(date);
      return isToday ? `Today, ${timeStr}` : `${dateFormatter.format(date)}, ${timeStr}`;
    }

    // ─── DROPBOX PHOTO SYNC ───
    async function initDropbox() {
      try {
        const cachedFiles = sessionStorage.getItem('hz_dropbox_files');
        if (cachedFiles) dropboxFiles = JSON.parse(cachedFiles);

        const r = await fetch('https://api.dropboxapi.com/oauth2/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            grant_type: 'refresh_token',
            refresh_token: DROPBOX_CONFIG.refreshToken,
            client_id: DROPBOX_CONFIG.appKey,
            client_secret: DROPBOX_CONFIG.appSecret
          })
        });
        const d = await r.json();
        if (d.access_token) {
          dropboxToken = d.access_token;
          if (Object.keys(dropboxFiles).length === 0) {
            await loadDropboxFiles(dropboxToken);
          }
          resolveVisibleAvatars();
        }
      } catch (err) {
        console.warn('Dropbox avatar notice:', err);
      }
    }

    async function loadDropboxFiles(token) {
      try {
        let cursor = null, hasMore = true;
        const map = {};
        while (hasMore) {
          const url = cursor ? 'https://api.dropboxapi.com/2/files/list_folder/continue' : 'https://api.dropboxapi.com/2/files/list_folder';
          const r = await fetch(url, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(cursor ? { cursor } : { path: DROPBOX_CONFIG.folderPath, recursive: false, limit: 2000 })
          });
          const d = await r.json();
          if (!r.ok) break;
          for (const e of d.entries || []) {
            if (e['.tag'] !== 'file' || !/\.(jpe?g|png)$/i.test(e.name)) continue;
            const norm = e.name.replace(/\.[^/.]+$/, '').toLowerCase().replace(/[^a-z0-9]/g, '');
            map[norm] = e.path_lower;
          }
          hasMore = d.has_more;
          cursor = d.cursor;
        }
        dropboxFiles = map;
        sessionStorage.setItem('hz_dropbox_files', JSON.stringify(map));
      } catch (err) {
        console.warn('Dropbox file listing notice:', err);
      }
    }

    function findPhotoPath(name) {
      if (!name) return null;
      const norm = name.toLowerCase().replace(/[^a-z0-9]/g, '');
      if (dropboxFiles[norm]) return dropboxFiles[norm];
      for (const [k, p] of Object.entries(dropboxFiles)) {
        if (norm.length > 5 && (k.includes(norm) || norm.includes(k))) return p;
      }
      return null;
    }

    async function getPhotoUrl(token, path) {
      if (!token || !path) return null;
      if (photoCache[path]) return photoCache[path];
      const sKey = `hz_photo_${path}`;
      const cached = sessionStorage.getItem(sKey);
      if (cached) {
        photoCache[path] = cached;
        return cached;
      }
      try {
        const lr = await fetch('https://api.dropboxapi.com/2/sharing/list_shared_links', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ path, direct_only: true })
        });
        const ld = await lr.json();
        let url = ld.links && ld.links.length > 0 ? ld.links[0].url : null;
        if (!url) {
          const cr = await fetch('https://api.dropboxapi.com/2/sharing/create_shared_link_with_settings', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ path, settings: { requested_visibility: 'public' } })
          });
          const cd = await cr.json();
          url = cd.url;
        }
        if (url) {
          url = url.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
          photoCache[path] = url;
          try { sessionStorage.setItem(sKey, url); } catch (e) {}
          return url;
        }
      } catch (e) {}
      return null;
    }

    async function resolveVisibleAvatars() {
      const avatarElements = document.querySelectorAll('[data-avatar-name]:not([data-avatar-loaded="true"])');
      for (const el of avatarElements) {
        const name = el.getAttribute('data-avatar-name');
        if (!name) continue;
        const path = findPhotoPath(name);
        if (path && dropboxToken) {
          const url = await getPhotoUrl(dropboxToken, path);
          if (url) {
            el.innerHTML = `<img src="${url}" alt="${name}" onerror="this.remove()">`;
            el.setAttribute('data-avatar-loaded', 'true');
          }
        }
      }
    }

          dmMessages = data.filter(m => m.recipient_id);

          // Update DM contacts if new messages arrived
          dmMessages.forEach(m => {
            if (m.student_id === currentUser.id && m.recipient_id) {
              addOrUpdateDmContact({ id: m.recipient_id, name: m.recipient_name || `Student ${m.recipient_id}` }, m.content);
            } else if (m.recipient_id === currentUser.id) {
              addOrUpdateDmContact({ id: m.student_id, name: m.student_name || `Student ${m.student_id}` }, m.content);
            }
          });

          renderMessages();
          if (wasScrolledToBottom) scrollToBottom();
        }
      } catch (e) {
        console.error('Load messages error:', e);
      }
    }

    function renderMessages() {
      let activeList = [];

      if (activeMode === 'global') {
        activeList = globalMessages;
      } else {
        if (!activeDmContact) {
          messagesContainer.innerHTML = `
            <div style="text-align: center; color: var(--text-dim); margin-top: 60px; font-size: 13px; font-family: var(--font-mono);">
              select or start a direct message to begin chatting
            </div>
          `;
          return;
        }

        activeList = dmMessages.filter(m => 
          (m.student_id === currentUser.id && m.recipient_id === activeDmContact.id) ||
          (m.student_id === activeDmContact.id && m.recipient_id === currentUser.id)
        );
      }

      const html = activeList.map(m => {
        const isMe = m.student_id === currentUser.id;
        const initials = (m.student_name || 'U').split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
        const timeAest = formatAEST(m.created_at);
        const isAdminMsg = m.is_admin === true;
        // User can delete their OWN messages, admins can delete ANY message
        const canDelete = isMe || currentUser.isAdmin;

        return `
          <div class="message-row ${isMe ? 'outgoing' : 'incoming'} ${isAdminMsg ? 'is-admin-msg' : ''}" data-msg-id="${m.id}">
            <div class="msg-avatar" data-avatar-name="${escapeHtml(m.student_name || '')}">
              ${escapeHtml(initials)}
            </div>
            <div class="msg-body">
              <div class="msg-meta">
                <span class="msg-author">${escapeHtml(m.student_name || 'Student')}</span>
                ${isAdminMsg ? '<span class="badge-admin-tag"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 2l8 4v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10V6z"/></svg>Admin</span>' : ''}
                <span class="msg-time">${timeAest}</span>
              </div>
              <div class="msg-bubble">
                ${escapeHtml(m.content)}
              </div>
            </div>
            ${canDelete ? `
              <div class="msg-actions">
                <button class="btn-msg-delete" onclick="deleteMessage('${m.id}')" title="Delete message">
                  <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      messagesContainer.innerHTML = html || `
        <div style="text-align: center; color: var(--text-dim); margin-top: 60px; font-size: 13px; font-family: var(--font-mono);">
          ${activeMode === 'global' ? 'no messages yet — be the first to say something' : `direct message history with ${escapeHtml(activeDmContact ? activeDmContact.name : 'this user')} is clear`}
        </div>
      `;

      resolveVisibleAvatars();
    }

    // ─── SEND MESSAGE ───
    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || !currentUser.id || !sbClient) return;

      if (activeMode === 'dms' && !activeDmContact) {
        alert("Please select a student from the sidebar or click '+ New DM' first.");
        return;
      }

      // Rate limit (7 messages in 3 seconds for non-admins)
      if (!currentUser.isAdmin) {
        const now = Date.now();
        recentSendTimestamps = recentSendTimestamps.filter(t => now - t < 3000);

        if (recentSendTimestamps.length >= 7) {
          triggerRateLimitCooldown(5);
          return;
        }
        recentSendTimestamps.push(now);
      }

      const showAdmin = currentUser.isAdmin && chkAdminTag.checked;
      const targetRecipientId = activeMode === 'dms' ? activeDmContact.id : null;
      const targetRecipientName = activeMode === 'dms' ? activeDmContact.name : null;

      chatInput.value = '';
      btnSend.disabled = true;
      charCounter.textContent = '0 / 500';
      playBeep(true);

      try {
        const { data, error } = await sbClient
          .from('chat_messages')
          .insert({
            student_id: currentUser.id,
            student_name: currentUser.name,
            recipient_id: targetRecipientId,
            recipient_name: targetRecipientName,
            content: text,
            is_admin: showAdmin,
            is_deleted: false,
            created_at: new Date().toISOString()
          })
          .select();

        if (error) {
          alert('Failed to send message: ' + error.message);
          return;
        }

        if (activeMode === 'dms' && activeDmContact) {
          addOrUpdateDmContact(activeDmContact, text);
        }

        scrollToBottom();
      } catch (err) {
        console.error('Send error:', err);
      }
    }

    // ─── DELETE MESSAGE ───
    window.deleteMessage = async function(id) {
      if (!sbClient) return;
      if (!confirm('Delete this message?')) return;
      try {
        await sbClient
          .from('chat_messages')
          .update({ is_deleted: true })
          .eq('id', id);

        globalMessages = globalMessages.filter(m => m.id !== id);
        dmMessages = dmMessages.filter(m => m.id !== id);
        renderMessages();
      } catch (err) {
        console.error('Delete error:', err);
      }
    };

    btnAdminPurge.onclick = async () => {
      if (!currentUser.isAdmin || !sbClient) return;
      if (!confirm('Purge all chat messages for everyone? This cannot be undone.')) return;
      try {
        await sbClient
          .from('chat_messages')
          .update({ is_deleted: true })
          .eq('is_deleted', false);

        globalMessages = [];
        dmMessages = [];
        renderMessages();
      } catch (err) {
        console.error('Purge error:', err);
      }
    };

    function triggerRateLimitCooldown(seconds) {
      chatInput.disabled = true;
      btnSend.disabled = true;
      rateLimitBanner.classList.add('active');

      let remaining = seconds;
      rateLimitText.textContent = `rate limit hit (7 msgs / 3s) — cooling down ${remaining}s…`;

      if (cooldownTimer) clearInterval(cooldownTimer);
      cooldownTimer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(cooldownTimer);
          cooldownTimer = null;
          rateLimitBanner.classList.remove('active');
          chatInput.disabled = false;
          btnSend.disabled = chatInput.value.trim().length === 0;
          chatInput.focus();
        } else {
          rateLimitText.textContent = `cooling down ${remaining}s…`;
        }
      }, 1000);
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      btnScrollBottom.classList.remove('visible');
      isUserScrolledUp = false;
    }

    messagesContainer.onscroll = () => {
      const scrollPos = messagesContainer.scrollTop + messagesContainer.clientHeight;
      const threshold = messagesContainer.scrollHeight - 80;
      if (scrollPos < threshold) {
        isUserScrolledUp = true;
        btnScrollBottom.classList.add('visible');
      } else {
        isUserScrolledUp = false;
        btnScrollBottom.classList.remove('visible');
      }
    };

    btnScrollBottom.onclick = scrollToBottom;

    chatInput.oninput = () => {
      const len = chatInput.value.length;
      charCounter.textContent = `${len} / 500`;
      btnSend.disabled = chatInput.value.trim().length === 0;
    };

    chatInput.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    };

    btnSend.onclick = sendMessage;

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function setupRealtime() {
      if (!sbClient) return;
      sbClient
        .channel('public:chat_messages')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_messages' }, payload => {
          if (payload.eventType === 'INSERT') {
            const newMsg = payload.new;
            if (!newMsg.is_deleted) {
              if (newMsg.recipient_id) {
                // DM Message
                if (newMsg.student_id === currentUser.id || newMsg.recipient_id === currentUser.id) {
                  if (!dmMessages.some(m => m.id === newMsg.id)) {
                    dmMessages.push(newMsg);
                    const otherUser = newMsg.student_id === currentUser.id 
                      ? { id: newMsg.recipient_id, name: newMsg.recipient_name || `Student ${newMsg.recipient_id}` }
                      : { id: newMsg.student_id, name: newMsg.student_name || `Student ${newMsg.student_id}` };
                    addOrUpdateDmContact(otherUser, newMsg.content);
                    renderMessages();
                    if (newMsg.student_id !== currentUser.id) playBeep(false);
                    if (!isUserScrolledUp) scrollToBottom();
                  }
                }
              } else {
                // Global Message
                if (!globalMessages.some(m => m.id === newMsg.id)) {
                  globalMessages.push(newMsg);
                  renderMessages();
                  if (newMsg.student_id !== currentUser.id) playBeep(false);
                  if (!isUserScrolledUp) scrollToBottom();
                }
              }
            }
          } else if (payload.eventType === 'UPDATE') {
            const updated = payload.new;
            if (updated.is_deleted) {
              globalMessages = globalMessages.filter(m => m.id !== updated.id);
              dmMessages = dmMessages.filter(m => m.id !== updated.id);
            } else {
              const gIdx = globalMessages.findIndex(m => m.id === updated.id);
              if (gIdx !== -1) globalMessages[gIdx] = updated;
              const dIdx = dmMessages.findIndex(m => m.id === updated.id);
              if (dIdx !== -1) dmMessages[dIdx] = updated;
            }
            renderMessages();
          } else if (payload.eventType === 'DELETE') {
            globalMessages = globalMessages.filter(m => m.id !== payload.old.id);
            dmMessages = dmMessages.filter(m => m.id !== payload.old.id);
            renderMessages();
          }
        })
        .subscribe();

      setInterval(loadMessages, 2500);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await resolveUserIdentity();
      await loadMessages();
      scrollToBottom();
      setupRealtime();
      initDropbox();
    });
  </script>
</body>
</html>
